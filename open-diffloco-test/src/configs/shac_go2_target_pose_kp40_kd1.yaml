algorithm: shac
embodiment: go2
variant: blind_nolinvel_nokinref
model_xml: src/envs/go2/models/scene_mjx.xml

# 策略目标：四条腿统一使用用户指定的站立目标。
# MuJoCo 顺序为 [FL, FR, RL, RR]。
default_joint_pose:
  [0.0, 0.8, -1.5,
   0.0, 0.8, -1.5,
   0.0, 0.8, -1.5,
   0.0, 0.8, -1.5]

# 启动时从腹部贴近地面的折叠姿态，经实机控制器同款 tanh 轨迹站起。
# 折叠姿态中的髋外展角采用左右镜像符号，避免把单腿朝向不对称带入训练。
prone_joint_pose:
  [0.35, 1.36, -2.65,
   -0.35, 1.36, -2.65,
   0.50, 1.36, -2.65,
   -0.50, 1.36, -2.65]
prone_base_height: 0.057
prone_hold_steps: 25
standup_duration: 3.6
standup_kp_start: 20.0
standup_kp_end: 100.0
standup_kd: 6.0

# 训练和部署都以几何站立目标作为策略零点。起立结束后用站起增益
# 短暂保持目标，不再把低增益重力沉降姿态当作标准站姿。
default_base_height: 0.330
settled_joint_pose:
  [0.0, 0.8, -1.5,
   0.0, 0.8, -1.5,
   0.0, 0.8, -1.5,
   0.0, 0.8, -1.5]
settled_base_height: 0.330
# Locomotion policy reference. Zero action commands the stand-up target.
policy_joint_pose:
  [0.0, 0.8, -1.5,
   0.0, 0.8, -1.5,
   0.0, 0.8, -1.5,
   0.0, 0.8, -1.5]
target_base_height: 0.314
reset_settle_steps: 100

steps: 8000000
seed: 20260923
unroll_length: 16
num_envs: 256

cmd_zero_prob: [0.1, 0.2, 0.3]
cmd_stand_prob: 0.08
cmd_vel_x_range: [-1.5, 1.5]
cmd_vel_y_range: [-1.0, 1.0]
cmd_yaw_rate_range: [-1.5, 1.5]
track_weights: [1.0, 1.5, 1.0]

# difficulty=0 时固定为 kp=40、kd=1；
# 随课程逐渐扩展到完整随机化范围。
kp_range: [30.0, 50.0]
kd_range: [0.8, 1.2]
com_offset: [0.0, 0.0, 0.02]
no_curriculum: false
curriculum_grace: 800000
curriculum_steps: 6400000
zero_difficulty_frac: 0.10

actor_lr: 0.005
critic_lr: 0.0005
critic_iterations: 16
action_noise_std_start: 0.12
action_noise_std_end: 0.04
lr_decay: true
